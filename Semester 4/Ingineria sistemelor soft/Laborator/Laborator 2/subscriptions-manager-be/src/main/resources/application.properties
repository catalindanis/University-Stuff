quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=dbcata05
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/subscriptions_manager

quarkus.hibernate-orm.database.generation=update

mp.jwt.verify.issuer=subscriptions-manager
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.verify.key.location=jwt-secret.jwk
jwt.sign.secret=my-super-secret-key-that-is-long-enough!!
smallrye.jwt.new-token.lifespan=3600

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Origin,X-Requested-With
quarkus.http.cors.exposed-headers=Location,Content-Disposition
quarkus.http.cors.access-control-max-age=24H