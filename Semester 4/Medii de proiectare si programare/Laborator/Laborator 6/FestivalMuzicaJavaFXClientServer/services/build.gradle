plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'ro.mpp2026'
version = '1.0-SNAPSHOT'

def grpcVersion = '1.63.0'
def protobufVersion = '3.25.3'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.18.0'
    implementation project(':model')
    implementation project(':persistence')
    implementation project(':networking')

    // gRPC
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-services:${grpcVersion}"

    // Protobuf — varianta cu suport pentru Java modules
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"

    // javax.annotation — varianta corectă pentru Java modules
    implementation "jakarta.annotation:jakarta.annotation-api:2.1.1"

    implementation "javax.annotation:javax.annotation-api:1.3.2"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
        proto {
            srcDir 'src/main/proto'
        }
    }
}

test {
    useJUnitPlatform()
}

compileJava {
    options.compilerArgs += [
            '--add-reads', 'services=ALL-UNNAMED',
            '--add-reads', 'io.grpc=ALL-UNNAMED',
            '--add-reads', 'io.grpc.stub=ALL-UNNAMED',
            '--add-reads', 'io.grpc.protobuf=ALL-UNNAMED',
    ]
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}